<!doctype html>
<html lang="en">
  <head>
    <base href="/" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="Description" content="Counter App demo" />
    <title>counter-app</title>

    <style>
      :root,
      html,
      body {
        margin: 0;
        padding: 0;
      }

      #demo {
        margin: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 800px;
      }

      .row {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        align-items: flex-start;
      }

      counter-app {
        margin: 0;
      }
    </style>
  </head>

  <body>
    <div id="demo">
      <h1>counter-app</h1>

      <!-- Required instance #1: default / sane defaults -->
      <div class="row">
        <counter-app></counter-app>
      </div>

      <!-- Required instance #2: attributes supplied -->
      <div class="row">
        <counter-app counter="16" min="10" max="25"></counter-app>
      </div>
    </div>

    <!-- Import only (no JS logic in index.html) -->
    <script type="module" src="./counter-app.js"></script>
  </body>
</html>
